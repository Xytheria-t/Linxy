; Linxy 槽位配置。每行: 单个字母 = 目标应用的完整绝对路径(也支持 .lnk 快捷方式)
; 字母 A~Z, 最多 26 个槽位, 大小写都行。
;
; 热键规则:
;   切换   = Shift+Alt+字母   (首次按=启动; 再按=隐藏全部窗口; 再按=显示并聚焦)
;   关闭   = Shift+Ctrl+Alt+字母  (在切换基础上加 Ctrl, 结束该应用:
;          先向其窗口发关闭请求(等同 Alt+F4), 3 秒内未退出才强制结束进程)
;
; 特殊槽位: 字母后加 "!" (如 E!=C:\path\Vinea.lnk)
;   只切换"开/关", 不隐藏: 有窗口就关掉它们, 没窗口才启动。
;   必须指向 .lnk —— 用 .lnk 的文件名按窗口标题找窗口(例如 Vinea.lnk 找标题
;   含 Vinea 的窗口), 且只关标题命中的窗口, 不会动浏览器其它窗口。
;   适合浏览器 --app=... 打开的应用窗口: 它寄宿在浏览器进程里, 按进程识别
;   会把整个浏览器一起关掉。
;
; 注意:
;   - 某个字母被其他软件占用时, 启动会提示并跳过该槽位。
;   - 修改本文件后需重启 Linxy 才生效。
;   - 路径含空格也没关系, 直接写完整路径即可。
;   - 要给目标应用带启动参数时, 用引号包住路径, 参数写在引号后:
;     X="C:\Program Files\App\App.exe" -SomeFlag
;   - .lnk 会解析为实际指向的程序并保留启动参数; 也可以直接写
;     "带空格的完整路径" 参数 的形式(如浏览器启动器 chrome_proxy --app-id=...)
;     来一键打开。切换/关闭按进程识别: 启动器类目标把请求转交给主程序后
;     自己退出, Linxy 找不到对应进程, 对这类槽位热键只保证打开。
;   - 用 Alt+F4/点×关掉窗口后, 再按切换热键会重新启动应用。
;   - 目标程序需要管理员权限时, 会自动弹出 UAC 提权对话框(已处理错误码 740)。
;   - 以 ; 开头的行是注释。
;
; 示例(把本文件复制为 shortcuts.ini 并改成你自己的路径):
;
;   N=C:\Windows\notepad.exe
;   C="C:\Program Files\SomeApp\SomeApp.exe" -SomeFlag
;   D=C:\Users\<你>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\SomeApp.lnk
;   E!=C:\Tool\Linxy\Vinea.lnk      ; .lnk 指向浏览器 --app=file:///C:/Tool/Vinea/Vinea.html
